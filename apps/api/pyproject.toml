[project]
name = "bsi-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["bsi-core", "fastapi>=0.115", "uvicorn>=0.30"]

[tool.uv.sources]
bsi-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bsi_api"]
