[project]
name = "bsi-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bsi-core", "bsi-api", "bsi-workers"]

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/workers"]

[tool.uv.sources]
bsi-core = { workspace = true }
bsi-api = { workspace = true }
bsi-workers = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Env vars must be set before importing anything that reads them at import time.
"tests/conftest.py" = ["E402"]
# FastAPI's Depends(...) default-argument pattern is idiomatic, not a bug.
"apps/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/core/bsi_core"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real Vertex AI; skipped unless -m live"]
addopts = "-m 'not live'"
