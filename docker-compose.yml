services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bsi_owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: bsi
    ports: ["5433:5432"]
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: {}
